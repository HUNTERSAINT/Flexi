kind = "web"
previewPath = "/"
title = "Flexi Route"
version = "1.0.0"
id = "artifacts/flexi-route"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24878

[services.development]
run = "pnpm --filter @workspace/flexi-route run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flexi-route", "run", "build" ]
serve = "static"
publicDir = "artifacts/flexi-route/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24878"
BASE_PATH = "/"
